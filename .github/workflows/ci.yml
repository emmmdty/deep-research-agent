name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/gui-web/package-lock.json

      - name: Install GUI dependencies
        run: npm ci --prefix apps/gui-web

      - name: Build GUI
        run: npm run build --prefix apps/gui-web

      - name: Install demo-site dependencies
        run: npm ci --prefix apps/demo-site

      - name: Build demo-site
        run: npm run build --prefix apps/demo-site
