[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research-agent"
version = "0.1.0"
description = "An evidence-first deep research runtime for company and industry analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "emmmdty" },
]
keywords = ["deep-research", "evidence-first", "audit", "research-runtime", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "alembic>=1.13.0",
    "argon2-cffi>=23.1.0",
    "arxiv>=2.4.1",
    "beautifulsoup4>=4.14.3",
    "ddgs>=9.11.2",
    "fastapi>=0.115.0,<1.0.0",
    "gpt-researcher>=0.12.3",
    "httpx>=0.28.1",
    "langchain>=0.2.10,<0.4.0",
    "langchain-community>=0.2.10,<0.4.0",
    "langchain-openai>=0.1.10,<0.4.0",
    "langgraph>=0.1.0",
    "loguru>=0.7.3",
    "mcp>=1.18.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.2.0",
    "pypdf2>=3.0.1",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.2",
    "rich>=14.3.3",
    "sqlalchemy>=2.0.0",
    "tavily-python>=0.7.22",
    "uvicorn>=0.30.0,<1.0.0",
    "langchain-anthropic>=0.1.0,<0.4.0",
    "cryptography>=46.0.5",
    "pydantic-ai-slim[openai]>=2.12.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[project.urls]
Homepage = "https://github.com/emmmdty/deep-research-agent"
Repository = "https://github.com/emmmdty/deep-research-agent"
Issues = "https://github.com/emmmdty/deep-research-agent/issues"

[project.scripts]
deep-research-agent = "deep_research_agent.gateway.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.14.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["deep_research_agent*"]

[tool.setuptools.package-data]
"deep_research_agent.domain_packs" = ["packs/*.yaml"]
